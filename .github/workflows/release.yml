name: Release

# Publishing is manual and gated by the release environment (version tags, required reviewer).
# Run this workflow from the Actions tab on a v*.*.* tag matching package.json.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check the tag matches the package version
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')" || { echo "Tag $GITHUB_REF_NAME does not match package.json"; exit 1; }

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm test

      - name: Hygiene
        run: "! grep -riE 'v[o]uch|/U[s]ers/' --exclude-dir=node_modules --exclude-dir=.git --exclude=.git --exclude-dir=dist ."

      - name: Pack and generate CycloneDX SBOM
        run: |
          npm pack --json --ignore-scripts > pack.json
          node -p 'JSON.parse(require("node:fs").readFileSync("pack.json", "utf8"))[0].filename' > package-name.txt
          npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            *.tgz
            package-name.txt
            sbom.cdx.json
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-files

      - name: Publish with provenance
        run: |
          PACKAGE_FILE="$(cat package-name.txt)"
          npm publish "./$PACKAGE_FILE" --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Attach package and SBOM to the GitHub release
        run: |
          PACKAGE_FILE="$(cat package-name.txt)"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber "./$PACKAGE_FILE" ./sbom.cdx.json
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "./$PACKAGE_FILE" ./sbom.cdx.json
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
